gpu_enabled:
  - true
  - false

upload_build:
  - false

python:
  - 3.11
  - 3.12
  - 3.13

# Pin sysroot glibc to match Legate's current baseline and avoid newer
# toolchains needing RELR-aware binutils.
c_stdlib:
  - sysroot

c_stdlib_version:
  - "2.28"

numpy_version:
  # Not 2.1.0 which segfaults on asarray() sometimes, see
  # https://github.com/numpy/numpy/pull/27249
  - ">=1.22,!=2.1.0"

cmake_version:
  - ">=3.20.1,!=3.23.0"

cuda_compiler:
  - cuda-nvcc
